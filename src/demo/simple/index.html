<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple map demo</title>
    <link rel="icon" href="data:,">
    <script src="../../../lib/importmap.js"></script>
    <script src="../../../lib/demo/simple/demo.js" type="module"></script>
    <style>
      html,
      body,
      kayahr-map {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
      }

      .marker {
        display: block;
        width: 2rem;
        height: 2.75rem;
        margin: -2.75rem 0 0 -1rem;
        filter: drop-shadow(0 0.125rem 0.25rem rgb(0 0 0 / 50%));
      }

    </style>
  </head>
  <body>
    <kayahr-map center-x="6.9583" center-y="50.9413" zoom="15">
      <svg class="marker" viewBox="0 0 24 33" role="img" aria-label="Cologne Cathedral">
        <title>Cologne Cathedral</title>
        <a href="https://en.wikipedia.org/wiki/Cologne_Cathedral" target="_blank" rel="noopener noreferrer">
          <path d="M12 32S22 20.5 22 11A10 10 0 0 0 2 11c0 9.5 10 21 10 21Z" fill="#d00" stroke="white" stroke-width="2"></path>
          <circle cx="12" cy="11" r="3.5" fill="white"></circle>
        </a>
      </svg>
    </kayahr-map>
  </body>
</html>
